name: DashboardAD build candidate

on:
  push:
    branches:
      - v1.0
    paths:
      - "v1.0/**"
      - ".github/workflows/dashboardad-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check .\v1.0\UI\scripts\app.js
        shell: pwsh

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $files = @(
            ".\v1.0\Backend\Start-DashboardAD.ps1",
            ".\v1.0\Backend\DashboardAD.psm1",
            ".\v1.0\Setup\Credential-Setup.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message) at line $($_.Extent.StartLineNumber)" }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Restore for win-x64
        run: dotnet restore .\v1.0\DesktopHost\DashboardAD.Desktop.csproj -r win-x64

      - name: Build
        run: dotnet build .\v1.0\DesktopHost\DashboardAD.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish x64 candidate
        run: dotnet publish .\v1.0\DesktopHost\DashboardAD.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\DashboardAD-win-x64 --no-restore

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: DashboardAD-win-x64
          path: .\artifacts\DashboardAD-win-x64\
          if-no-files-found: error
          retention-days: 14
