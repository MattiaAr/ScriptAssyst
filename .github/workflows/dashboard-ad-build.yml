name: Dashboard AD Windows build

on:
  push:
    branches: [v1.0]
    paths:
      - "v1.0/**"
      - ".github/workflows/dashboard-ad-build.yml"
  pull_request:
    branches: [v1.0]
    paths:
      - "v1.0/**"
      - ".github/workflows/dashboard-ad-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\v1.0\DesktopHost\DashboardAD.Desktop.csproj

      - name: Build Release
        run: dotnet build .\v1.0\DesktopHost\DashboardAD.Desktop.csproj -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish .\v1.0\DesktopHost\DashboardAD.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .\artifacts\DashboardAD-win-x64

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: DashboardAD-win-x64
          path: artifacts/DashboardAD-win-x64/
          if-no-files-found: error
