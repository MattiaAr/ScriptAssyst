<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard AD</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">DA</div><div><strong>Dashboard AD</strong><small>Gestione Active Directory</small></div></div>
      <div class="mode-label">MODALITÀ</div>
      <div class="mode-switch" role="group" aria-label="Modalità interfaccia">
        <button class="mode active" data-mode="dashboard">Dashboard</button>
        <button class="mode" data-mode="guided">Guidata</button>
        <button class="mode" data-mode="logs">LOG</button>
      </div>
      <nav aria-label="Navigazione principale">
        <button class="nav-item active" data-page="overview"><span>▦</span> Panoramica</button>
        <button class="nav-item" data-page="users"><span>♙</span> Utenti</button>
        <button class="nav-item" data-page="groups"><span>♧</span> Gruppi</button>
        <button class="nav-item" data-page="ous"><span>▤</span> Unità organizzative</button>
        <button class="nav-item" data-page="gpo"><span>⚙</span> Criteri GPO</button>
        <button class="nav-item" data-page="tasks"><span>◷</span> Attività pianificate</button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span><span id="connection-label">Verifica connessione…</span><small>v1.0 · backend locale</small></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">GESTIONE DIRECTORY</div><h1 id="page-title">Panoramica</h1></div><div class="top-actions"><span class="environment"><span class="status-dot"></span> Verifica Active Directory…</span><label class="language-picker" title="Lingua interfaccia"><span aria-hidden="true">文</span><select id="language-select" aria-label="Lingua interfaccia"><option value="it">Italiano</option><option value="en">English</option></select></label><div class="avatar">SA</div></div></header>
      <section id="app-content" class="content" aria-live="polite"></section>
      <footer>Dashboard AD <span>•</span> Gestione AD: le operazioni disponibili richiedono conferma e autorizzazioni di dominio.</footer>
    </main>
  </div>
  <script src="scripts/app.js"></script>
</body>
</html>
